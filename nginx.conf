# Configuration Nginx pour SPA React avec Vite
# À placer dans /etc/nginx/sites-available/ ou inclure dans la configuration principale

server {
    listen 80;
    server_name diabara.tv www.diabara.tv;
    
    # Chemin vers le dossier de build
    root /var/www/diabara.tv/dist;
    index index.html;

    # Types MIME corrects pour les fichiers JavaScript
    location ~* \.(js|mjs)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        # Cache pour les fichiers JS
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebAssembly
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JSON
    location ~* \.json$ {
        add_header Content-Type "application/json; charset=utf-8";
    }

    # Service des fichiers statiques dans /assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service des autres fichiers statiques (icons, screenshots, etc.)
    location ~* ^/(icons|screenshots)/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Toutes les autres requêtes redirigent vers index.html pour React Router
    location / {
        try_files $uri $uri/ /index.html;
        
        # Pas de cache pour index.html
        if ($uri = '/index.html') {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Compression GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

    # Headers de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/diabara.tv.access.log;
    error_log /var/log/nginx/diabara.tv.error.log;
}

